version: '3.9'
services:
  golang-task-manager:
    build: .
    ports:
      - "8080:8080"
    env_file: .env
    depends_on:
      - postgres
      - redis
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: resu
      POSTGRES_PASSWORD: drowssap
      POSTGRES_DB: task-manager-db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7
    environment:
      - REDIS_PASSWORD=drowssap
    command: redis-server --requirepass $REDIS_PASSWORD
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
volumes:
  pgdata: 
  redisdata: